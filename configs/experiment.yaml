project:
  name: blindspot-observatory
  version: 0.1.0

reproducibility:
  seed: 42
  n_seeds_benchmark: 20

model:
  model_id: ""
  temperature: 0.2
  max_tokens: 1000
  cache_responses: true

data:
  survey: ZTF
  manifest_path: data/manifest.parquet
  n_images: 5
  filters: [g, r]

injection:
  n_per_batch: 50
  n_batches: 10
  mag_range_relative: [-2.0, 1.0]
  min_separation_px: 20
  profile: gaussian

detection:
  method: sep
  threshold_sigma: 5.0
  match_radius_px: 2.0

metrics:
  confidence_level: 0.95
  ci_method: wilson
  mag_bin_width: 0.25

benchmark:
  injection_budget: 2000
  methods: [grid, random, latin_hypercube, agent]